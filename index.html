<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Job Search HQ</title>
<script>
/* Apply the saved theme before first paint so light-mode users don't get a
   dark flash. Key must match Store.KEY; App.applyTheme owns it after load. */
(function () {
  try {
    var s = JSON.parse(localStorage.getItem('career-dashboard-v1'));
    var t = s && s.settings && s.settings.theme;
    if (t === 'system') t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
    if (t === 'light') document.documentElement.dataset.theme = 'light';
  } catch (e) { /* corrupted state — fall through to the dark default */ }
})();
</script>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<header class="app-header">
  <div class="header-left">
    <h1>Job Search HQ</h1>
    <span id="countdown-chip" class="countdown-chip"></span>
    <button class="tiny" id="quick-note-btn" title="Capture a thought from anywhere">+ Note</button>
  </div>
  <nav class="tabs" id="tab-nav">
    <button class="tab active" data-tab="overview">Overview</button>
    <button class="tab" data-tab="calendar">Calendar</button>
    <button class="tab" data-tab="contacts">Contacts</button>
    <button class="tab" data-tab="pipeline">Pipeline</button>
    <button class="tab" data-tab="hill">Hill</button>
    <button class="tab" data-tab="stories">Stories</button>
    <button class="tab" data-tab="resume">Resume / ATS</button>
    <button class="tab" data-tab="notes">Notes</button>
    <button class="tab" data-tab="settings">Settings</button>
  </nav>
</header>

<div id="backup-banner" class="banner hidden"></div>

<main>
  <section id="tab-overview" class="tab-panel"></section>
  <section id="tab-calendar" class="tab-panel hidden"></section>
  <section id="tab-contacts" class="tab-panel hidden"></section>
  <section id="tab-pipeline" class="tab-panel hidden"></section>
  <section id="tab-hill" class="tab-panel hidden"></section>
  <section id="tab-stories" class="tab-panel hidden"></section>
  <section id="tab-resume" class="tab-panel hidden"></section>
  <section id="tab-notes" class="tab-panel hidden"></section>
  <section id="tab-settings" class="tab-panel hidden"></section>
</main>

<script src="js/store.js"></script>
<script src="js/csv.js"></script>
<script src="js/contacts.js"></script>
<script src="js/pipeline.js"></script>
<script src="js/hill.js"></script>
<script src="js/hill-seed.js" onerror="this.remove()"></script>
<script src="js/personal-seed.js" onerror="this.remove()"></script>
<script src="js/stories.js"></script>
<script src="js/meetings.js"></script>
<script src="js/resume.js"></script>
<script src="js/dashboard.js"></script>
<script src="js/notes.js"></script>
<script src="js/app.js"></script>
</body>
</html>
